services:
  db:
    image: postgres:18
    container_name: wedding_db
    restart: always
    environment:
      POSTGRES_USER: wedding_db_user
      POSTGRES_PASSWORD: wedding_db_pw
      POSTGRES_DB: wedding_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8
    container_name: wedding_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  service-wed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-wed
    environment:
      - DATABASE_URL=postgresql+asyncpg://wedding_db_user:wedding_db_pw@db:5432/wedding_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-wed-worker
    command: ["arq", "service_wed.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://wedding_db_user:wedding_db_pw@db:5432/wedding_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:5173}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
