services:
  db:
    image: postgres:18
    container_name: wedding_db
    restart: always
    environment:
      POSTGRES_USER: wedding_db_user
      POSTGRES_PASSWORD: wedding_db_pw
      POSTGRES_DB: wedding_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8
    container_name: wedding_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  service-wed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-wed
    # DEBUG/CORS_ALLOW_ORIGINS are read from the host's .env (root of
    # service-wed/) via docker-compose's ${VAR:-default} substitution, not
    # from inside the container -- see README's "Configuration" section.
    # Defaults here preserve prior behavior (DEBUG off) unless you set
    # DEBUG=true in .env, which the frontend needs locally: with DEBUG
    # false the admin_session cookie is Secure-only and a browser won't
    # send it back over plain http://localhost:5173 (see README's
    # "Integrating with a React + Vite + Node.js frontend" section).
    environment:
      - DATABASE_URL=postgresql+asyncpg://wedding_db_user:wedding_db_pw@db:5432/wedding_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Base URL used to build the {{ rsvp_url }} embedded in campaign
      # emails (services/campaigns.py's build_email_message) -- defaults to
      # Vite's dev port since that's what a local frontend runs on.
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  # Runs the arq cron jobs (tasks/dispatch.py's per-minute dispatch_due_emails,
  # tasks/reminders.py's daily evaluate_reminders) and the send_email job they
  # enqueue. Without this, campaigns/reminders build EmailMessage rows that
  # stay "scheduled" forever -- nothing else ever claims and sends them
  # (confirmed by testing: the API alone left two campaign emails sitting
  # unsent until this worker ran). Same image as service-wed, just a
  # different process/command against the same DB and Redis.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-wed-worker
    command: ["arq", "service_wed.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://wedding_db_user:wedding_db_pw@db:5432/wedding_db
      - REDIS_URL=redis://redis:6379/0
      # Also needed here, not just service-wed: tasks/reminders.py's
      # evaluate_reminders cron runs in THIS process and calls the same
      # build_email_message() that embeds {{ rsvp_url }}.
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:5173}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
