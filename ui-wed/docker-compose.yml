services:
  ui-wed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # No safe generic default -- a standalone ui-wed has no reverse
        # proxy unifying it with a backend on the same origin (unlike the
        # root docker-compose.yml's Traefik-fronted setup), so it must be
        # told exactly where service-wed is reachable.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env to wherever your standalone service-wed is reachable, e.g. https://api.example.com}
        VITE_COUPLE_NAMES: ${VITE_COUPLE_NAMES:-}
        VITE_BRIDE_FNAME: ${VITE_BRIDE_FNAME:-}
        VITE_GROOM_FNAME: ${VITE_GROOM_FNAME:-}
        VITE_WEDDING_DATE: ${VITE_WEDDING_DATE:-}
        VITE_VENUE_NAME: ${VITE_VENUE_NAME:-}
        VITE_VENUE_CITY: ${VITE_VENUE_CITY:-}
        VITE_RSVP_DEADLINE: ${VITE_RSVP_DEADLINE:-}
    container_name: ui-wed
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
