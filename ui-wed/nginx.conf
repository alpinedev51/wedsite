# Serves the built SPA. Security headers (CSP, HSTS, X-Frame-Options, ...)
# are NOT set here -- Traefik adds them to every response (see
# traefik/dynamic.yml), so they live in one place for both the UI and API.
server {
    # nginx-unprivileged runs as non-root, so it can't bind port 80.
    listen 8080;
    server_name _;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;
    # Redirects (e.g. a directory without a trailing slash) use a relative
    # Location. Otherwise nginx builds an absolute URL from its own view of
    # the request -- http:// and port 8080 -- which is wrong behind
    # Traefik + Cloudflare.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container health check (docker-compose.yml). Harmless if hit publicly.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles and images: the filename changes whenever the
    # content does, so they can be cached forever (by browsers and by
    # Cloudflare's edge). A missing file is a real 404, not the SPA.
    # Cache-Control is set directly rather than with `expires`, which would
    # add a second, conflicting Cache-Control header.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the SPA: serve the file if it exists, otherwise
    # index.html and let React Router handle the path. no-cache = always
    # revalidate, so a new deploy's index.html (pointing at new hashed
    # bundles) is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
