# Serves the Vite build output behind Traefik. The one thing this needs
# beyond nginx's defaults: react-router's createBrowserRouter does
# client-side routing, so a request for e.g. /admin/guests has to fall back
# to index.html (letting the router take over) instead of 404ing -- nginx
# has no idea /admin/guests isn't a real file on disk.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
