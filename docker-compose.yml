services:
  traefik:
    image: traefik:v3.7
    container_name: wedding_proxy
    restart: unless-stopped
    command:
      # this exposes the Traefik dashboard on :8080
      # with no auth at all -- fine on a home LAN, but revisit (remove this
      # flag, or add dashboard auth) once wed.austinkylieb.com is internet-
      # facing, or anyone can reach your routing config.
      - "--api.insecure=true" # enables local dashbaord at http://localhost:8080
      - "--providers.docker=true" # tells traefik to listen to docker daemon
      - "--providers.docker.exposedbydefault=false" # secure default: don't expose containers unless labeled
      - "--entrypoints.web.address=:80" # define port 80 entrypoint
      - "--entrypoints.websecure.address=:443" # define port 443 entrypoint
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      # Host-side ports only -- these are the ones you've actually had to
      # move before (Pi-hole/Nextcloud conflicts), so they're the ports
      # worth making configurable. The container-internal side (right of
      # each colon) matches --entrypoints.*.address above and never needs
      # to change.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:18
    container_name: wedding_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding_db_user}
      # No fallback default for the password, deliberately -- ${VAR:?...}
      # makes `docker compose up` fail loudly instead of silently falling
      # back to the old hardcoded "wedding_db_pw", which has appeared in
      # plaintext throughout this project's history/testing and should be
      # treated as burned. Pick a real one in .env before deploying for real.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env -- see .env.example. Do not reuse wedding_db_pw.}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # service-wed now runs `alembic upgrade head` immediately on container
    # start (see its command below) -- plain `depends_on: [db]` only waits
    # for this container to *start*, not for Postgres to actually be ready
    # to accept connections, so a fresh `docker compose up` could hit
    # alembic before Postgres finishes initializing. This healthcheck plus
    # service-wed/worker's `condition: service_healthy` below closes that race.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wedding_db_user} -d ${POSTGRES_DB:-wedding_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8
    container_name: wedding_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  service-wed:
    build:
      context: ./service-wed
      dockerfile: Dockerfile
    container_name: service-wed
    restart: on-failure
    # 1. Migrations: always safe to re-run -- already-applied ones are
    #    skipped, so this is a no-op on every restart after the first.
    # 2. container_bootstrap: seeds the admin account / wedding config ONLY
    #    if they don't already exist (see that script's module docstring for
    #    why this must never blindly re-apply ADMIN_PASSWORD/WEDDING_DATE on
    #    every restart -- it would silently overwrite a rotated password or
    #    a wedding date edited since through the admin UI). A no-op after
    #    first boot, same as the migration step.
    # 3. `exec uvicorn ...`: replaces this shell with uvicorn as PID 1, so
    #    `docker stop`/compose's SIGTERM reaches uvicorn directly instead of
    #    an intermediate shell process swallowing it.
    command: >
      sh -c "alembic upgrade head &&
      python -m service_wed.scripts.container_bootstrap &&
      exec uvicorn service_wed.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Built from the exact same POSTGRES_USER/PASSWORD/DB vars as the db
      # service above, not a separate copy -- change one place in .env and
      # both sides update together, so there's no way for this connection
      # string to drift out of sync with what Postgres actually has.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      # No DEBUG/CORS_ALLOW_ORIGINS here (unlike service-wed/docker-compose.yml's
      # local-dev setup): Traefik terminates real HTTPS and the SPA calls the
      # API same-origin (see ui-wed's src/config/env.ts), so the admin_session
      # cookie's Secure flag works as-is and there's no cross-origin request
      # for CORS to allow in the first place.
      # RESEND_WEBHOOK_SECRET verifies incoming Resend delivery-event webhooks
      # (controllers/v1/webhooks.py) -- read from a root .env file (see
      # .env.example) that you create on the Pi with your real values; never
      # commit real secrets here.
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      # Consumed by container_bootstrap.py above -- same variables
      # service-wed/scripts/bootstrap.sh reads, just from this root .env
      # instead. Leave ADMIN_EMAIL/ADMIN_PASSWORD/WEDDING_DATE/RSVP_DEADLINE
      # unset to skip seeding entirely (e.g. if you'd rather do it by hand).
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WEDDING_DATE=${WEDDING_DATE:-}
      - RSVP_DEADLINE=${RSVP_DEADLINE:-}
      - RSVP_OPENS_AT=${RSVP_OPENS_AT:-}
      - VENUE_NAME=${VENUE_NAME:-}
      - VENUE_ADDRESS=${VENUE_ADDRESS:-}
      - REMINDER_CAP=${REMINDER_CAP:-2}
      - REMINDER_INTERVAL_DAYS=${REMINDER_INTERVAL_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # No Host() matcher, deliberately: this box is reached by a LAN IP for
      # now and a real domain (wed.austinkylieb.com) later, and PathPrefix
      # alone is enough to disambiguate from ui-wed's catch-all below since
      # Traefik prioritizes routers by rule specificity -- so this keeps
      # working unchanged when the hostname changes. Add
      # "&& Host(`wed.austinkylieb.com`)" back here once that's live if you
      # want to also reject traffic that isn't on the expected domain.
      - "traefik.http.routers.service-wed.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.service-wed.entrypoints=websecure"
      - "traefik.http.routers.service-wed.tls=true"
      # Tell Traefik which internal container port to send traffic to
      - "traefik.http.services.service-wed.loadbalancer.server.port=8000"
      # FLAGGING, not removing: there's no /mcp route anywhere in
      # service-wed's current controllers (only health/auth/wedding/
      # invitations/rsvp/households/campaigns/dashboard/exports/webhooks) --
      # this looks like it was carried over from a template and may be dead
      # config. Left in (updated to match the Host()-less pattern above)
      # rather than deleted outright in case it's for something planned;
      # worth confirming and removing if not.
      - "traefik.http.routers.mcp.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"

  # Runs the arq cron jobs (tasks/dispatch.py's per-minute dispatch_due_emails,
  # tasks/reminders.py's daily evaluate_reminders) and the send_email job they
  # enqueue. Without this, campaigns/reminders build EmailMessage rows that
  # stay "scheduled" forever -- nothing else ever claims and sends them. This
  # was missing from this file entirely (present only in
  # service-wed/docker-compose.yml's dev-only stack) -- same image as
  # service-wed, just a different process/command against the same DB/Redis.
  worker:
    build:
      context: ./service-wed
      dockerfile: Dockerfile
    container_name: service-wed-worker
    restart: on-failure
    command: ["arq", "service_wed.worker.WorkerSettings"]
    environment:
      # Same shared POSTGRES_* vars as service-wed and the db service above.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      # This is the process that actually calls Resend (tasks/dispatch.py's
      # send_email job) -- without these, RESEND_API_KEY stays unset and
      # every campaign email just prints to this container's logs via the
      # console sender instead of actually sending, silently, forever.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-wedding@example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ui-wed:
    build:
      context: ./ui-wed
      dockerfile: Dockerfile
    container_name: ui-wed
    # No environment and no published ports, deliberately: the frontend
    # calls the API same-origin/relative (src/config/env.ts's default),
    # baked in at build time, and Traefik is the only intended entry point
    # -- nginx (this image's runner stage) listens on 80 internally, not
    # 5173, so a host port mapping here has nothing meaningful behind it.
    depends_on:
      - service-wed
    labels:
      - "traefik.enable=true"
      # Catch-all: PathPrefix(`/`) matches everything service-wed's more
      # specific `/api` rule above doesn't. Same no-Host()-matcher reasoning
      # as service-wed's router -- see the comment there.
      - "traefik.http.routers.ui-wed.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ui-wed.entrypoints=websecure"
      - "traefik.http.routers.ui-wed.tls=true"
      # nginx (this image's runner stage) listens on 80, not Vite's 5173 --
      # there's no Vite dev server running in this container anymore.
      - "traefik.http.services.ui-wed.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
