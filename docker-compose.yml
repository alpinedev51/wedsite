services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wedding_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in your .env file}

  traefik:
    image: traefik:v3.7
    container_name: wedding_proxy
    restart: unless-stopped
    command:
      - "--providers.docker=true" # tells traefik to listen to docker daemon
      - "--providers.docker.exposedbydefault=false" # secure default: don't expose containers unless labeled
      - "--entrypoints.web.address=:80" # define port 80 entrypoint
      - "--entrypoints.web.forwardedHeaders.insecure=true"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:18
    container_name: wedding_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env -- see .env.example. Do not reuse wedding_db_pw.}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wedding_db_user} -d ${POSTGRES_DB:-wedding_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8
    container_name: wedding_redis
    restart: always
    volumes:
      - redis_data:/data

  service-wed:
    image: ${IMAGE_REPO:-wed-website}/service-wed:${IMAGE_TAG:-latest}
    build:
      context: ./service-wed
      dockerfile: Dockerfile
    container_name: service-wed
    restart: on-failure
    # 1. Migrations: always safe to re-run -- already-applied ones are
    #    skipped, so this is a no-op on every restart after the first.
    # 2. container_bootstrap: seeds the admin account / wedding config ONLY
    #    if they don't already exist (see that script's module docstring for
    #    why this must never blindly re-apply ADMIN_PASSWORD/WEDDING_DATE on
    #    every restart -- it would silently overwrite a rotated password or
    #    a wedding date edited since through the admin UI). A no-op after
    #    first boot, same as the migration step.
    # 3. `exec uvicorn ...`: replaces this shell with uvicorn as PID 1, so
    #    `docker stop`/compose's SIGTERM reaches uvicorn directly instead of
    #    an intermediate shell process swallowing it.
    command: >
      sh -c "alembic upgrade head &&
      python -m service_wed.scripts.container_bootstrap &&
      exec uvicorn service_wed.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env to wherever ui-wed is actually reachable, e.g. https://192.168.50.9 or https://wed.austinkylieb.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WEDDING_DATE=${WEDDING_DATE:-}
      - RSVP_DEADLINE=${RSVP_DEADLINE:-}
      - RSVP_OPENS_AT=${RSVP_OPENS_AT:-}
      - VENUE_NAME=${VENUE_NAME:-}
      - VENUE_ADDRESS=${VENUE_ADDRESS:-}
      - VENUE_CITY=${VENUE_CITY:-}
      - BRIDE_FNAME=${BRIDE_FNAME:-}
      - GROOM_FNAME=${GROOM_FNAME:-}
      - REMINDER_CAP=${REMINDER_CAP:-2}
      - REMINDER_INTERVAL_DAYS=${REMINDER_INTERVAL_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.service-wed.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.service-wed.entrypoints=web"
      - "traefik.http.services.service-wed.loadbalancer.server.port=8000"

  worker:
    image: ${IMAGE_REPO:-wed-website}/worker:${IMAGE_TAG:-latest}
    build:
      context: ./service-wed
      dockerfile: Dockerfile
    container_name: service-wed-worker
    restart: on-failure
    command: ["arq", "service_wed.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-wedding@example.com}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ui-wed:
    image: ${IMAGE_REPO:-wed-website}/ui-wed:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: ./ui-wed
      dockerfile: Dockerfile
      # These all default to empty, so the placeholders in
      # ui-wed/src/config/wedding.ts are the only fallback. A non-empty
      # default here would make the site think real names were set.
      args:
        VITE_COUPLE_NAMES: ${COUPLE_NAMES:-}
        VITE_BRIDE_FNAME: ${BRIDE_FNAME:-}
        VITE_GROOM_FNAME: ${GROOM_FNAME:-}
        VITE_WEDDING_DATE: ${WEDDING_DATE:-}
        VITE_VENUE_NAME: ${VENUE_NAME:-}
        VITE_VENUE_CITY: ${VENUE_CITY:-}
        VITE_RSVP_DEADLINE: ${RSVP_DEADLINE:-}
    container_name: ui-wed
    depends_on:
      - service-wed
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-wed.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ui-wed.entrypoints=web"
      - "traefik.http.services.ui-wed.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
