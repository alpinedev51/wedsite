# Production stack. Network layout -- each container joins only what it needs:
#   edge   cloudflared -> traefik -> service-wed / ui-wed
#   data   service-wed, worker -> db, redis      (internal: no internet)
#   egress worker -> internet (Resend API)
#   socket traefik -> socket-proxy               (internal: no internet)
# So the tunnel container can't reach Postgres/Redis at all, and the
# database has no route to the internet.

# Rotate container logs (Docker keeps them forever by default and a small
# server's disk fills up). Applied to every service via `logging: *logging`.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    container_name: wedding_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in your .env file}
    networks: [edge]
    logging: *logging

  traefik:
    image: traefik:v3.7.16
    container_name: wedding_proxy
    restart: unless-stopped
    command:
      # Container discovery goes through socket-proxy (below), not the raw
      # Docker socket: the proxy only allows read-only container listing, so
      # a Traefik bug can't be turned into control of Docker (= root on the
      # host).
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false" # only containers labelled traefik.enable=true
      - "--providers.docker.network=wed_edge" # reach services over `edge`, not `data`
      # Security-header middlewares (traefik/dynamic.yml). The folder is
      # watched, so a deploy that changes it applies without a restart.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      # /ping for the health check below; served on Traefik's internal
      # :8080 entrypoint, which is not published or routed anywhere.
      - "--ping=true"
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
    # Loopback only. Guests arrive through cloudflared over the `edge`
    # network; this port is just for testing on the server itself
    # (curl localhost). Published ports skip the host firewall (Docker
    # writes its own iptables rules), so binding to 0.0.0.0 here would put
    # an un-Cloudflared copy of the site on the open internet.
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    # The folder, not the single file: git checkout replaces dynamic.yml
    # with a new file, and a single-file bind mount would keep showing the
    # old one until the container is recreated.
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - socket-proxy
    networks: [edge, socket]
    logging: *logging

  # Read-only gatekeeper in front of the Docker socket for Traefik. Only
  # container listing/inspection, events, version and ping are allowed
  # (CONTAINERS=1, the rest are this image's defaults); every write (POST)
  # is refused.
  socket-proxy:
    image: linuxserver/socket-proxy:3.4.7
    container_name: wedding_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks: [socket]
    logging: *logging

  db:
    image: postgres:18.6
    container_name: wedding_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env -- see .env.example. Do not reuse wedding_db_pw.}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wedding_db_user} -d ${POSTGRES_DB:-wedding_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *logging

  redis:
    image: redis:8.10.2
    container_name: wedding_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *logging

  service-wed:
    image: ${IMAGE_REPO:-wed-website}/service-wed:${IMAGE_TAG:-latest}
    build:
      context: ./service-wed
      dockerfile: Dockerfile
    container_name: service-wed
    restart: unless-stopped
    # 1. Migrations: always safe to re-run -- already-applied ones are
    #    skipped, so this is a no-op on every restart after the first.
    # 2. container_bootstrap: seeds the admin account / wedding config ONLY
    #    if they don't already exist (see that script's module docstring for
    #    why this must never blindly re-apply ADMIN_PASSWORD/WEDDING_DATE on
    #    every restart -- it would silently overwrite a rotated password or
    #    a wedding date edited since through the admin UI). A no-op after
    #    first boot, same as the migration step.
    # 3. `exec uvicorn ...`: replaces this shell with uvicorn as PID 1, so
    #    `docker stop`/compose's SIGTERM reaches uvicorn directly instead of
    #    an intermediate shell process swallowing it.
    command: >
      sh -c "alembic upgrade head &&
      python -m service_wed.scripts.container_bootstrap &&
      exec uvicorn service_wed.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env to wherever ui-wed is actually reachable, e.g. https://192.168.50.9 or https://wed.austinkylieb.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WEDDING_DATE=${WEDDING_DATE:-}
      - RSVP_DEADLINE=${RSVP_DEADLINE:-}
      - RSVP_OPENS_AT=${RSVP_OPENS_AT:-}
      - VENUE_NAME=${VENUE_NAME:-}
      - VENUE_ADDRESS=${VENUE_ADDRESS:-}
      - VENUE_CITY=${VENUE_CITY:-}
      - BRIDE_FNAME=${BRIDE_FNAME:-}
      - GROOM_FNAME=${GROOM_FNAME:-}
      - REMINDER_CAP=${REMINDER_CAP:-2}
      - REMINDER_INTERVAL_DAYS=${REMINDER_INTERVAL_DAYS:-7}
      # Real visitor IP for rate limiting. Cloudflare sets this on every
      # request through the tunnel; without it every guest shares Traefik's
      # IP and one rate-limit bucket. Only safe because the tunnel is the
      # only way in -- see settings.client_ip_header.
      - CLIENT_IP_HEADER=CF-Connecting-IP
    # Python, not curl: the slim image has no curl. start_period covers
    # migrations + bootstrap running before uvicorn starts listening.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.service-wed.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.service-wed.entrypoints=web"
      - "traefik.http.routers.service-wed.middlewares=security-headers@file,csp-api@file"
      - "traefik.http.services.service-wed.loadbalancer.server.port=8000"
    # edge: Traefik reaches it. data: Postgres/Redis.
    networks: [edge, data]
    logging: *logging

  worker:
    # Same image as service-wed (same code, different command), so CI
    # builds and publishes one backend image, not two identical ones. No
    # `build:` here: `docker compose build` builds it once, via service-wed.
    image: ${IMAGE_REPO:-wed-website}/service-wed:${IMAGE_TAG:-latest}
    container_name: service-wed-worker
    restart: unless-stopped
    command: ["arq", "service_wed.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wedding_db_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wedding_db}
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-wedding@example.com}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # data: Postgres/Redis. egress: outbound HTTPS to Resend. Not on edge --
    # nothing should route traffic to the worker.
    networks: [data, egress]
    logging: *logging

  ui-wed:
    image: ${IMAGE_REPO:-wed-website}/ui-wed:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: ./ui-wed
      dockerfile: Dockerfile
      # These all default to empty, so the placeholders in
      # ui-wed/src/config/wedding.ts are the only fallback. A non-empty
      # default here would make the site think real names were set.
      args:
        VITE_COUPLE_NAMES: ${COUPLE_NAMES:-}
        VITE_BRIDE_FNAME: ${BRIDE_FNAME:-}
        VITE_GROOM_FNAME: ${GROOM_FNAME:-}
        VITE_WEDDING_DATE: ${WEDDING_DATE:-}
        VITE_VENUE_NAME: ${VENUE_NAME:-}
        VITE_VENUE_CITY: ${VENUE_CITY:-}
        VITE_RSVP_DEADLINE: ${RSVP_DEADLINE:-}
    container_name: ui-wed
    depends_on:
      - service-wed
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-wed.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ui-wed.entrypoints=web"
      - "traefik.http.routers.ui-wed.middlewares=security-headers@file,csp-ui@file"
      # nginx-unprivileged listens on 8080 (non-root can't bind 80).
      - "traefik.http.services.ui-wed.loadbalancer.server.port=8080"
    networks: [edge]
    logging: *logging

networks:
  # Fixed name so Traefik's --providers.docker.network can refer to it
  # regardless of the compose project name.
  edge:
    name: wed_edge
  data:
    internal: true
  egress: {}
  socket:
    internal: true

volumes:
  postgres_data:
  redis_data:
