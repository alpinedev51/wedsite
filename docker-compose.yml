services:
  traefik:
    image: traefik:v3.7
    container_name: wedding_proxy
    restart: unless-stopped
    command:
      - "--api.insecure=true" # enables local dashbaord at http://localhost:8080
      - "--providers.docker=true" # tells traefik to listen to docker daemon
      - "--providers.docker.exposedbydefault=false" # secure default: don't expose containers unless labeled
      - "--entrypoints.web.address=:80" # define port 80 entrypoint
      - "--entrypoints.websecure.address=:443" # define port 443 entrypoint
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "8081:80"
      - "8443:443"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ui-wed:
    build:
      context: ./ui-wed
      dockerfile: Dockerfile
    container_name: ui-wed
    environment:
      - VITE_API_URL=https://localhost:8000/api
    ports:
      - "5713:5173"
    labels:
      - "traefik.enable=true"
      # Route all other root traffic to the ui-wed react container
      - "traefik.http.routers.ui-wed.rule=Host(`192.168.50.9`) && PathPrefix(`/`)"
      - "traefik.http.routers.ui-wed.entrypoints=websecure"
      - "traefik.http.routers.ui-wed.tls=true"
      - "traefik.http.services.ui-wed.loadbalancer.server.port=5173"
