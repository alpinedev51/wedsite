# CI: scan for leaked secrets, then build the two images and (on main)
# publish them to GHCR for the server to pull with deploy/deploy.sh.
#
#   pull request -> secret scan + lint + build both images (nothing is pushed)
#   push to main -> secret scan + lint + build + push
#                   ghcr.io/<owner>/<repo>/service-wed:sha-<full commit sha>
#                   ghcr.io/<owner>/<repo>/ui-wed:sha-<full commit sha>
#                   (plus :latest on both)
#
# The worker runs the service-wed image with a different command, so there
# is no separate worker image.
#
# ui-wed's build-time values come from GitHub repository *variables*
# (Settings -> Secrets and variables -> Actions -> Variables), named exactly
# like the .env keys: COUPLE_NAMES, BRIDE_FNAME, GROOM_FNAME, WEDDING_DATE,
# VENUE_NAME, VENUE_CITY, RSVP_DEADLINE -- plus optional MILESTONES_JSON
# (the real Our Story content, kept out of the public repo). They are all
# public on the site anyway, so they are variables, not secrets. Unset ones
# build with the placeholders in ui-wed/src/config/wedding.ts.
#
# Each `uses: owner/action@<40-char hash> # vX.Y.Z` pins an action to one
# exact commit. A tag like v7 can be moved by whoever controls the action
# (that's how the 2025 tj-actions compromise spread); a commit hash can't.
# The comment says which release the hash is. To upgrade, swap in the new
# release's commit hash and update the comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main build halfway through publishing; PR builds can go.
  # GitHub keeps at most one run *waiting* per group: push three commits
  # quickly and the middle one is skipped, so it has no images. deploy.sh
  # refuses such a commit; deploy the newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRUFFLEHOG_VERSION: "3.99.3"
  # Only main publishes images (deploy.sh only deploys commits on main).
  # A manual run on another branch builds but doesn't push.
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's GitHub token in .git/config: nothing
          # later needs it, and this checkout is handed to a third-party
          # scanner image below.
          persist-credentials: false
          # Full history: this is a public repo, so a secret in any old
          # commit is as exposed as one in the latest. Scanning all of it
          # takes seconds at this size.
          fetch-depth: 0

      # verified = the provider confirmed the credential works.
      # unknown  = it couldn't be checked either way -- treat as real.
      # Skips "unverified" (the provider rejected it), which here is only
      # a package checksum in an old uv.lock that looks like a Sentry token.
      # --fail exits non-zero on any finding, failing the job.
      - name: Scan full git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            "trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            git file:///repo \
            --results=verified,unknown \
            --fail --no-update

  # Static checks, the same ones as in the root README's "Checks" section.
  # The frontend's type-check (tsc -b) runs inside its image build, so it
  # isn't repeated here.
  lint-service-wed:
    name: Lint service-wed (ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-wed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs uv; uv then installs Python (from .python-version) and the
      # exact dev dependencies in uv.lock (--locked fails if it's stale).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run mypy src

  lint-ui-wed:
    name: Lint ui-wed (eslint, prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-wed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # same major as ui-wed/Dockerfile
          cache: npm
          cache-dependency-path: ui-wed/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build ${{ matrix.image }}
    # Lint failures block publishing, like the secret scan.
    needs: [secret-scan, lint-service-wed, lint-ui-wed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR (GITHUB_TOKEN, no PAT needed)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service-wed
            context: service-wed
            build-args: ""
          - image: ui-wed
            context: ui-wed
            # VITE_API_BASE_URL is left unset on purpose: empty = same-origin
            # /api calls, which is what Traefik serves (src/config/env.ts).
            build-args: |
              VITE_COUPLE_NAMES=${{ vars.COUPLE_NAMES }}
              VITE_BRIDE_FNAME=${{ vars.BRIDE_FNAME }}
              VITE_GROOM_FNAME=${{ vars.GROOM_FNAME }}
              VITE_WEDDING_DATE=${{ vars.WEDDING_DATE }}
              VITE_VENUE_NAME=${{ vars.VENUE_NAME }}
              VITE_VENUE_CITY=${{ vars.VENUE_CITY }}
              VITE_RSVP_DEADLINE=${{ vars.RSVP_DEADLINE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # GHCR login below uses its own token

      # Optional: the real Our Story timeline. wedding.ts picks up
      # milestones.json when present and falls back to the committed
      # example otherwise. Written into the build context only, never
      # committed.
      - name: Add Our Story content
        if: matrix.image == 'ui-wed'
        env:
          MILESTONES_JSON: ${{ vars.MILESTONES_JSON }}
        run: |
          if [ -n "$MILESTONES_JSON" ]; then
            printf '%s' "$MILESTONES_JSON" > ui-wed/src/config/milestones.json
            python3 -m json.tool ui-wed/src/config/milestones.json > /dev/null
            echo "Using milestones.json from the MILESTONES_JSON variable."
          else
            echo "MILESTONES_JSON not set -- building with milestones.example.json."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # sha-<full sha> is what deploy.sh deploys. latest is only a
          # convenience pointer to the newest main build.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          # The Hetzner CPX11 is x86_64.
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-hint:
    name: Deploy command
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print the command to deploy this build
        run: |
          {
            echo "### Images published"
            echo
            echo "Deploy this build on the server with:"
            echo
            echo '```'
            echo "/opt/wedsite/deploy/deploy.sh ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
