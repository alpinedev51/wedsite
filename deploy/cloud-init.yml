#cloud-config
# Paste in once, when creating the server:
#   Hetzner: Console -> Add Server -> "Cloud config"
#   AWS:     EC2 -> Launch instance -> Advanced details -> "User data"
# It runs deploy/server-setup.sh on first boot; see that file for what it
# does. Progress: /var/log/wedsite-setup.log on the server.
#
# Before pasting, set REPO below to your GitHub repo (<github-user>/<repo>),
# and optionally fill in TAILSCALE_AUTHKEY below to reach the
# server over Tailscale (then port 22 can stay closed). Use a ONE-TIME,
# short-expiry key: anything in cloud config stays readable from inside
# the server (the provider's metadata service). Leave it empty to use plain
# SSH with the key you pick in the console, or AWS SSM Session Manager.
#
# No secrets for the app go here -- .env is filled in over SSH afterwards.

runcmd:
  - - bash
    - -c
    - |
      set -euo pipefail
      REPO='<github-user>/<repo>'
      case "$REPO" in *"<"*) echo "cloud-init: set REPO before pasting" >/var/log/wedsite-setup.log; exit 1 ;; esac
      curl -fsSL --retry 5 "https://raw.githubusercontent.com/$REPO/main/deploy/server-setup.sh" -o /root/server-setup.sh
      REPO_URL="https://github.com/$REPO.git" TAILSCALE_AUTHKEY='' bash /root/server-setup.sh >/var/log/wedsite-setup.log 2>&1
